services:
  - type: web
    runtime: python
    name: feishu-calendar-mcp
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: FEISHU_APP_ID
        sync: false
      - key: FEISHU_APP_SECRET
        sync: false
      - key: FEISHU_ATTENDEE_OPEN_ID
        sync: false
      - key: PORT
        value: 10000
